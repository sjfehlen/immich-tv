# Builds a signed APK and attaches it to a GitHub release when a version tag is pushed:
#   git tag v1.1.0 && git push origin v1.1.0
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
name: Release APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Version from tag
        run: |
          name="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$name"
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for v in RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::$v secret is not set"; exit 1; }
          done
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set (see README > Publishing a release)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks" \
            || { echo "::error::RELEASE_KEYSTORE_BASE64 is not valid base64 (copy the whole line)"; exit 1; }
          # Check the secrets fit together before a long build (messages never include the values).
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" > /dev/null 2>&1 \
            || { echo "::error::Keystore, RELEASE_KEYSTORE_PASSWORD or RELEASE_KEY_ALIAS don't match"; exit 1; }
          echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon test assembleRelease 2>&1 | tee build.log; then
            # Surface Gradle's reason as an annotation, visible on the run page without logs.
            msg=$(grep -A6 "What went wrong" build.log | head -8 | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error::Build failed: ${msg:-see log}"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk immich-home.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: immich-home.apk
          generate_release_notes: true
